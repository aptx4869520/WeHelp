<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Assignment</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1 class="header">歡迎光臨，請輸入帳號密碼</h1>
         
            <section class="content">
                <h2>登入系統</h2>

                 <form id="login-form" action="/login" method="post">
                    <div class="form-row">
                        <label for="email">信箱</label>
                        <input type="text" id="email" name="email">
                    </div>

                    <div class="form-row">
                        <label for="password">密碼</label>
                        <input type="password" id="password" name="password">
                    </div>

                    <div class="checkbox-row">
                        <label for="agree">同意條款</label>
                        <input type="checkbox" id="agree" name="agree">
                    </div>

                    <button type="submit">登入</button>
                </form>
            </section>

            <section class="content hotel-search">
                <h2>取得旅館資訊</h2>

                <div class="form-row">
                    <label for="hotel-id">編號</label>
                    <input type="text" id="hotel-id">
                </div>

                <button id="hotel-button" type="button">取得</button>
            </section>
        </section>            
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
